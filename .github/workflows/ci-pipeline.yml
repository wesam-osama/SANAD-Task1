name: SANAD CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # 1. فحص الأسرار والبيانات الحساسة
  secrets-scan:
    name: Secrets Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secrets Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. فحص الثغرات في المكتبات والاعتماديات
  security-and-dependencies:
    name: Dependency & Security Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./audex-sandbox-api
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci

      - name: Run NPM Audit Check
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run Trivy File System Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './audex-sandbox-api'
          severity: 'CRITICAL,HIGH'

  # 3. تشغيل الاختبارات الآلية
  automated-tests:
    name: Automated Tests
    runs-on: ubuntu-latest
    needs: [secrets-scan, security-and-dependencies]
    defaults:
      run:
        working-directory: ./audex-sandbox-api
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test -- --passWithNoTests

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: audex-sandbox-api/coverage/